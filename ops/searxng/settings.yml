# SearXNG chỉ phục vụ pipeline nghiên cứu sâu trong mạng Compose nội bộ (không publish cổng).
# Khóa bí mật lấy từ biến môi trường SEARXNG_SECRET.
#
# Danh sách engine chọn theo kiểm thử thực tế ngày 2026-10-24 từ máy chủ này: Bing web, Mojeek,
# Startpage trả kết quả lạc đề (chỉ khớp từ đầu tiên), Brave/DuckDuckGo/Google/Qwant chặn IP.
# Các engine dưới đây trả kết quả đúng chủ đề cho truy vấn về AI agent doanh nghiệp.
use_default_settings:
  engines:
    keep_only:
      - yahoo
      - yep
      - bing news
      - mwmbl
      - hackernews
      - wikipedia
      - semantic scholar
      - openalex
      - crossref
      - arxiv
      - github

engines:
  - name: yahoo
    disabled: false
  - name: yep
    disabled: false
  - name: mwmbl
    disabled: false
  - name: hackernews
    disabled: false
  - name: openalex
    disabled: false
  - name: crossref
    disabled: false

general:
  instance_name: "Business AI Agents research"
  enable_metrics: false

server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
