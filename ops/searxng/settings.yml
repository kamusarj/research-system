# SearXNG chỉ phục vụ pipeline nghiên cứu sâu trong mạng Compose nội bộ (không publish cổng).
# Khóa bí mật lấy từ biến môi trường SEARXNG_SECRET.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave
      - bing
      - mojeek
      - startpage
      - wikipedia
      - arxiv
      - github

# Một số engine mặc định tắt trong SearXNG; bật rõ ràng để có nhiều nguồn khi một engine bị
# chặn (Brave/DuckDuckGo hay trả CAPTCHA hoặc "too many requests" với IP máy chủ).
engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false

general:
  instance_name: "Business AI Agents research"
  enable_metrics: false

server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  request_timeout: 3.0
  max_request_timeout: 6.0
