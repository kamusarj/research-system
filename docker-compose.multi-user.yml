services:
  api:
    environment:
      API_RELOAD: "false"
      API_WORKERS: ${API_WORKERS:-4}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-4}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-2}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-15}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}

  frontend:
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    command: >-
      sh -ec 'npm ls --include=dev --depth=0 >/dev/null 2>&1 || npm ci --include=dev --no-audit --no-fund;
      npm run build;
      cp -R .next/static .next/standalone/.next/static;
      if [ -d public ]; then cp -R public .next/standalone/public; fi;
      HOSTNAME=0.0.0.0 PORT=3000 exec node .next/standalone/server.js'
