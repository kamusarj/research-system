services:
  database:
    environment:
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  api:
    secrets:
      - database_url
      - openai_api_key
      - deepseek_api_key
      - mistral_api_key
      - minio_access_key
      - minio_secret_key
      - metrics_bearer_token
      - browserless_token
      - neo4j_password
      - meilisearch_api_key

  neo4j:
    environment:
      NEO4J_AUTH: null
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
    secrets:
      - neo4j_auth

  meilisearch:
    environment:
      MEILI_MASTER_KEY: null
    entrypoint:
      - /bin/sh
      - -ec
      - export MEILI_MASTER_KEY="$$(cat /run/secrets/meilisearch_master_key)"; exec /bin/meilisearch
    secrets:
      - meilisearch_master_key

  worker:
    secrets:
      - database_url
      - mistral_api_key
      - minio_access_key
      - minio_secret_key
      - browserless_token

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:?Set POSTGRES_PASSWORD_SECRET_FILE}
  database_url:
    file: ${DATABASE_URL_SECRET_FILE:?Set DATABASE_URL_SECRET_FILE}
  openai_api_key:
    file: ${OPENAI_API_KEY_SECRET_FILE:?Set OPENAI_API_KEY_SECRET_FILE}
  deepseek_api_key:
    file: ${DEEPSEEK_API_KEY_SECRET_FILE:?Set DEEPSEEK_API_KEY_SECRET_FILE}
  mistral_api_key:
    file: ${MISTRAL_API_KEY_SECRET_FILE:?Set MISTRAL_API_KEY_SECRET_FILE}
  minio_access_key:
    file: ${MINIO_ACCESS_KEY_SECRET_FILE:?Set MINIO_ACCESS_KEY_SECRET_FILE}
  minio_secret_key:
    file: ${MINIO_SECRET_KEY_SECRET_FILE:?Set MINIO_SECRET_KEY_SECRET_FILE}
  metrics_bearer_token:
    file: ${METRICS_BEARER_TOKEN_SECRET_FILE:?Set METRICS_BEARER_TOKEN_SECRET_FILE}
  browserless_token:
    file: ${BROWSERLESS_TOKEN_SECRET_FILE:?Set BROWSERLESS_TOKEN_SECRET_FILE}
  neo4j_password:
    file: ${NEO4J_PASSWORD_SECRET_FILE:?Set NEO4J_PASSWORD_SECRET_FILE}
  neo4j_auth:
    file: ${NEO4J_AUTH_SECRET_FILE:?Set NEO4J_AUTH_SECRET_FILE}
  meilisearch_api_key:
    file: ${MEILISEARCH_API_KEY_SECRET_FILE:?Set MEILISEARCH_API_KEY_SECRET_FILE}
  meilisearch_master_key:
    file: ${MEILI_MASTER_KEY_SECRET_FILE:?Set MEILI_MASTER_KEY_SECRET_FILE}
