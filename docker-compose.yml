  SEARCH_EMBEDDING_DIMENSIONS: ${SEARCH_EMBEDDING_DIMENSIONS:-1024}
  SEARCH_EMBEDDING_CHUNK_CHARS: ${SEARCH_EMBEDDING_CHUNK_CHARS:-4000}
  SEARCH_EMBEDDING_MAX_CHUNKS_PER_ITEM: ${SEARCH_EMBEDDING_MAX_CHUNKS_PER_ITEM:-32}
  SEARCH_EMBEDDING_BATCH_SIZE: ${SEARCH_EMBEDDING_BATCH_SIZE:-32}
  SEARCH_EMBEDDING_REQUEST_RETRIES: ${SEARCH_EMBEDDING_REQUEST_RETRIES:-2}
  SEARCH_EMBEDDING_RETRY_BACKOFF_SECONDS: ${SEARCH_EMBEDDING_RETRY_BACKOFF_SECONDS:-0.5}
  SEARCH_DOCUMENT_MAX_CHARS: ${SEARCH_DOCUMENT_MAX_CHARS:-120000}
  SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-100}

services:
  ollama-bridge:
    profiles: ["local-ai"]
    build: ./apps/api
    network_mode: host
    environment:
      OLLAMA_BRIDGE_UPSTREAM: ${OLLAMA_BRIDGE_UPSTREAM:-http://127.0.0.1:11434}
      OLLAMA_BRIDGE_BIND: ${OLLAMA_BRIDGE_BIND:-172.17.0.1}
      OLLAMA_BRIDGE_PORT: ${OLLAMA_BRIDGE_PORT:-11435}
    volumes:
      - ./apps/api:/app
    command: sh -c "uvicorn app.ollama_bridge:app --host $${OLLAMA_BRIDGE_BIND} --port $${OLLAMA_BRIDGE_PORT}"

  database:
    image: pgvector/pgvector:0.8.5-pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research}
      POSTGRES_USER: ${POSTGRES_USER:-research}
      # Chỉ có hiệu lực khi volume dữ liệu được tạo lần đầu; đổi mật khẩu sau đó cần ALTER USER.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Máy tìm kiếm tổng hợp cho pipeline nghiên cứu sâu: chỉ mạng nội bộ, không mở cổng ra máy chủ.
  searxng:
    profiles: ["research-agent"]
    image: searxng/searxng:2026.10.9-f4822b3fc@sha256:85492ba800a861e3e8ff6014c430e81369fe6ca766a9990595f616d1ce95b272
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./ops/searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /var/cache/searxng
    expose:
      - "8080"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"

  meilisearch:
    profiles: ["search"]
    image: getmeili/meilisearch:v1.37.0@sha256:9cde2774864e6c19cdd09fcd2950bc01ac9a0454b6f343fffafa14faae6eb7ea
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_NO_ANALYTICS: "true"
    expose:
      - "7700"
    volumes:
      - meilisearch_data:/meili_data

  browserless:
    profiles: ["browser"]
    image: ghcr.io/browserless/chromium@sha256:9e48bf8df71ba285f974dd9bd9effb59ce8a1e767cfe734b36a24b065ab033f4
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:-}
      CONCURRENT: ${BROWSERLESS_CONCURRENT:-2}
      QUEUED: ${BROWSERLESS_QUEUE_LENGTH:-10}
      TIMEOUT: ${BROWSERLESS_TIMEOUT_MS:-30000}
      DEBUG: "-browserless*"
    expose:
      - "3000"

  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5.26.12-community@sha256:9f75e8df4325a24f00fdd7a8c0bcce650a58375049b1058e496e8b43d6c36b37
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-256m}
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'RETURN 1' | cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    restart: unless-stopped
    # Tiến trình init thu dọn tiến trình con mồ côi (xelatex/tesseract) và chuyển tiếp tín hiệu dừng.
    init: true
    environment: *app-environment
    depends_on:
      database:
        condition: service_healthy
    ports:
      # Chỉ nghe trên máy chủ: với AUTH_MODE=disabled, mở ra LAN là trao quyền owner cho mọi máy
      # cùng mạng. Đặt API_BIND=0.0.0.0 chỉ khi đã bật đăng nhập và thật sự cần truy cập từ LAN.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - document_objects:/var/lib/research-system/objects
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    command: >-
      sh -ec 'alembic upgrade head;
      if [ "$${API_RELOAD}" = "true" ]; then
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload;
      fi;
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers "$${API_WORKERS}"'

  worker:
    build: ./apps/api
    restart: unless-stopped
    init: true
    environment: *app-environment
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./apps/api:/app
      - document_objects:/var/lib/research-system/objects
    command: python -m app.worker

  # Opt-in: `docker compose --profile discord up -d discord-bot`. The gateway refuses to
  # start without an explicit guild and channel allowlist, so an unconfigured deployment
  # cannot quietly begin collecting from every server the bot is invited to.
  discord-bot:
    build: ./apps/discord-bot
    profiles: ["discord"]
    environment:
      RESEARCH_API_URL: http://api:8000
      SECRETS_DIR: ${SECRET_FILES_DIR:-/run/secrets}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      RESEARCH_API_TOKEN: ${DISCORD_RESEARCH_API_TOKEN:-}
      DISCORD_ALLOWED_GUILD_IDS: ${DISCORD_ALLOWED_GUILD_IDS:-}
      DISCORD_ALLOWED_CHANNEL_IDS: ${DISCORD_ALLOWED_CHANNEL_IDS:-}
      DISCORD_INTAKE_NAMESPACE: ${DISCORD_INTAKE_NAMESPACE:-discord}
      DISCORD_INTAKE_PROVIDER: ${DISCORD_INTAKE_PROVIDER:-}
      DISCORD_AUTO_APPROVE_LINKS: ${DISCORD_AUTO_APPROVE_LINKS:-false}
      DISCORD_LOCALE: ${DISCORD_LOCALE:-vi}
      DISCORD_POLL_INTERVAL_SECONDS: ${DISCORD_POLL_INTERVAL_SECONDS:-5}
      DISCORD_POLL_ATTEMPTS: ${DISCORD_POLL_ATTEMPTS:-36}
      DISCORD_USER_RATE_LIMIT: ${DISCORD_USER_RATE_LIMIT:-10}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/web
      # Ảnh phát triển: mã nguồn được bind-mount đè lên /app. Bản triển khai nhóm dùng target `runner`.
      target: dev
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8000
      API_PROXY_TIMEOUT_MS: ${API_PROXY_TIMEOUT_MS:-180000}
    depends_on:
      - api
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - frontend_modules:/app/node_modules
      - frontend_next:/app/.next
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/graph').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    # The named node_modules volume survives image rebuilds, so sync it when package.json changes.
    command: sh -ec "npm ls --include=dev --depth=0 >/dev/null 2>&1 || npm ci --include=dev --no-audit --no-fund; exec npm run dev -- --hostname 0.0.0.0"

volumes:
  postgres_data:
  frontend_modules:
  frontend_next:
  document_objects:
  neo4j_data:
  meilisearch_data:
