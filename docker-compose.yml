  MEILISEARCH_BATCH_SIZE: ${MEILISEARCH_BATCH_SIZE:-500}
  MEILISEARCH_REQUEST_TIMEOUT_SECONDS: ${MEILISEARCH_REQUEST_TIMEOUT_SECONDS:-10}
  MEILISEARCH_TASK_TIMEOUT_SECONDS: ${MEILISEARCH_TASK_TIMEOUT_SECONDS:-60}
  SEARCH_EMBEDDING_PROVIDER: ${SEARCH_EMBEDDING_PROVIDER:-mistral}
