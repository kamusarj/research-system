  CHATGPT_PLAN_APP_URL: ${CHATGPT_PLAN_APP_URL:-}
  CHATGPT_PLAN_DEFAULT_MODEL: ${CHATGPT_PLAN_DEFAULT_MODEL:-}
  CHATGPT_PLAN_REASONING_EFFORT: ${CHATGPT_PLAN_REASONING_EFFORT:-}
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
  INTAKE_MAX_ATTEMPTS: ${INTAKE_MAX_ATTEMPTS:-3}
  INTAKE_MAX_CONTENT_BYTES: ${INTAKE_MAX_CONTENT_BYTES:-2000000}
  INTAKE_MAX_PDF_BYTES: ${INTAKE_MAX_PDF_BYTES:-25000000}
