  LATEX_COMPILE_TIMEOUT_SECONDS: ${LATEX_COMPILE_TIMEOUT_SECONDS:-20}
  LATEX_COMPILE_MAX_SOURCE_CHARS: ${LATEX_COMPILE_MAX_SOURCE_CHARS:-200000}
  LATEX_COMPILE_MAX_PDF_BYTES: ${LATEX_COMPILE_MAX_PDF_BYTES:-10000000}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GRAPH_DATA_PROVIDER: ${GRAPH_DATA_PROVIDER:-postgres}
  GRAPH_DEFAULT_NODE_LIMIT: ${GRAPH_DEFAULT_NODE_LIMIT:-40}
  GRAPH_MAX_NODE_LIMIT: ${GRAPH_MAX_NODE_LIMIT:-1000}
  GRAPH_MAX_EDGE_LIMIT: ${GRAPH_MAX_EDGE_LIMIT:-4000}
