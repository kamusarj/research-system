[project]
name = "research-discord-gateway"
version = "0.1.0"
description = "Bộ kết nối Discord gọn nhẹ, chuyển liên kết công khai và PDF vào API tiếp nhận của Hệ thống nghiên cứu."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7.1,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
research-discord-gateway = "app.bot:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
